<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillMap - Target Input</title>
<!-- Google Fonts: Inter -->

              "surface-container-highest": "#303443",

              "primary-fixed": "#d7e2ff",
              "on-secondary": "#330099",
              "outline": "#8c909e",
              "surface-container-lowest": "#090e1b",
              "on-primary-fixed": "#001a40",
              "tertiary-container": "#d37b02",
              "surface-container-high": "#252a38",
              "on-tertiary-container": "#412200",
              "outline-variant": "#424753",
              "inverse-surface": "#dee2f5",

            "borderRadius": {

<style>
      .glass-panel {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      }
      .text-gradient {
        background: linear-gradient(to right, #acc7ff, #cbbeff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .bg-gradient-btn {
        background: linear-gradient(135deg, #508ff8 0%, #4d24c0 100%);
      }
      .bg-gradient-btn:hover {
        background: linear-gradient(135deg, #427ce3 0%, #3e1b9b 100%);
      }
      .custom-input {
        background-color: rgba(14, 19, 32, 0.5);
        border: 1px solid rgba(140, 144, 158, 0.3);
        color: #dee2f5;
        transition: all 0.2s ease;
      }
      .custom-input:focus {
        border-color: #508ff8;
        box-shadow: 0 0 0 1px #508ff8, 0 0 15px rgba(80, 143, 248, 0.2);
        outline: none;
      }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Sidebar Navigation -->
<nav class="fixed left-0 top-0 h-screen w-sidebar-width border-r border-outline-variant/20 bg-surface-container-low shadow-sm flex flex-col py-unit-lg px-unit-md z-50 hidden md:flex">
<div class="flex items-center gap-3 mb-unit-xl px-2">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-on-surface">SkillMap</span>
</div>
<div class="flex flex-col gap-2 flex-grow">
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</div>
<div class="mt-auto mb-unit-lg">
<button class="w-full bg-gradient-btn text-white font-label-md text-label-md py-3 rounded-full hover:opacity-90 transition-opacity">
          Analyze Skills
        </button>
</div>
<div class="pt-4 border-t border-outline-variant/20">
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-label-md text-label-md">Logout</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-grow md:ml-sidebar-width p-margin-mobile md:p-margin-desktop min-h-screen relative flex flex-col justify-center items-center">
<!-- Mobile Header -->
<div class="absolute top-6 left-6 right-6 flex justify-between items-center md:hidden">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-on-surface">SkillMap</span>
<button class="text-on-surface p-2 hover:bg-surface-container rounded-lg">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
<!-- Target Input Bento Card -->
<div class="w-full max-w-2xl bg-surface-container rounded-3xl border border-outline-variant/20 shadow-xl overflow-hidden glass-panel">
<!-- Card Header -->
<div class="px-8 pt-8 pb-6 border-b border-outline-variant/10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Define Your Goal</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tell us what role or milestone you are targeting next.</p>
</div>
<!-- Card Body (Form) -->
<form class="p-8 space-y-6" onsubmit="event.preventDefault();">
<!-- Target Role Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="target-role">Target Role / Job Title</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl">work</span>
</span>
<input class="custom-input block w-full pl-12 pr-4 py-3.5 rounded-xl font-body-md text-body-md placeholder-outline-variant" id="target-role" placeholder="e.g. Senior Frontend Engineer, UX Manager" required="" type="text"/>
</div>
</div>
<!-- Target Company / Context (Optional) -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block" for="target-context">Target Company or Industry (Optional)</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl">corporate_fare</span>
</span>
<input class="custom-input block w-full pl-12 pr-4 py-3.5 rounded-xl font-body-md text-body-md placeholder-outline-variant" id="target-context" placeholder="e.g. Google, Tech Startup, Healthcare" type="text"/>
</div>
</div>
<!-- Timeline Selection -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">Target Timeline</label>
<div class="grid grid-cols-3 gap-4">
<label class="border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center gap-1 cursor-pointer hover:border-primary-container/60 hover:bg-surface-container-high transition-all">
<input class="sr-only" name="timeline" type="radio" value="short"/>
<span class="font-body-md text-body-md font-semibold text-on-surface">3-6 Months</span>
<span class="font-label-md text-label-md text-on-surface-variant">Immediate</span>
</label>
<label class="border border-primary-container/80 bg-primary-container/10 rounded-xl p-4 flex flex-col items-center gap-1 cursor-pointer hover:border-primary-container hover:bg-primary-container/15 transition-all">
<input checked="" class="sr-only" name="timeline" type="radio" value="mid"/>
<span class="font-body-md text-body-md font-semibold text-on-surface">6-12 Months</span>
<span class="font-label-md text-label-md text-on-surface-variant">Recommended</span>
</label>
<label class="border border-outline-variant/40 rounded-xl p-4 flex flex-col items-center gap-1 cursor-pointer hover:border-primary-container/60 hover:bg-surface-container-high transition-all">
<input class="sr-only" name="timeline" type="radio" value="long"/>
<span class="font-body-md text-body-md font-semibold text-on-surface">1-2 Years</span>
<span class="font-label-md text-label-md text-on-surface-variant">Long-term</span>
</label>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex gap-4">
<button class="flex-1 bg-surface-container-low border border-outline-variant/40 hover:bg-surface-container-high hover:border-outline-variant text-on-surface font-body-md text-body-md py-3.5 rounded-xl transition-colors font-semibold" type="button">
            Back
          </button>
<button class="flex-2 bg-gradient-btn text-white font-body-md text-body-md font-semibold py-3.5 rounded-xl shadow-md transition-all duration-200 hover:shadow-lg flex items-center justify-center gap-2" type="submit">
            Start Analysis
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
</div>
</form>
</div>
</main>
</body></html>
